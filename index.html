<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Optometry Measurement Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1c1c1e; color: #fff; text-align: center; }
        #toolbar { background: #2c2c2e; padding: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
        button, label.btn { background: #0a84ff; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        button.active { background: #30d158; }
        button.warning { background: #ff9f0a; }
        button.danger { background: #ff453a; }
        input[type="file"] { display: none; }
        #info-panel { background: #3a3a3c; padding: 10px; font-size: 15px; font-weight: bold; color: #ffd60a; }
        #canvas-container { position: relative; margin: 10px auto; display: inline-block; max-width: 95vw; border: 1px solid #444; overflow: hidden; }
        canvas { display: block; max-width: 100%; cursor: crosshair; touch-action: none; }
    </style>
</head>
<body>

<div id="toolbar">
    <label class="btn" for="fileInput">📁 โหลดรูปภาพ</label>
    <input type="file" id="fileInput" accept="image/*">
    <button id="btnCalib" class="active" onclick="setMode('calib')">1. ตั้งสเกลอ้างอิง</button>
    <button id="btnMeasure" onclick="setMode('measure')">2. วัดระยะ (mm)</button>
    <button id="btnAngle" onclick="setMode('angle')">3. วัดองศา (°)</button>
    <button id="btnPan" onclick="setMode('pan')">🔍 ย้าย/ซูมรูป</button>
    <button onclick="resetZoom()">🎯 รีเซ็ตมุมมอง</button>
    <button class="warning" onclick="undo()">↩️ ย้อนกลับ</button>
    <button class="danger" onclick="clearAll()">🔄 ล้างค่าทั้งหมด</button>
</div>

<div id="info-panel">สถานะ: กรุณาถ่าย/โหลดรูป แล้วลากเส้นอ้างอิง</div>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info-panel');
    
    let img = new Image();
    let mode = 'calib';
    let points = [];
    let scale = 0;
    let calibLine = null;
    let measurements = [];

    // ตัวแปรสำหรับจัดการการ Zoom และ Pan
    let zoomScale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startPanX = 0;
    let startPanY = 0;
    
    // สำหรับจัดการ Multi-touch บนมือถือ
    let activePointers = new Map();
    let initialPinchDistance = null;

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                resetZoom();
                resetData();
                draw();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    function resetZoom() {
        zoomScale = 1;
        panX = 0;
        panY = 0;
        draw();
    }

    function setMode(newMode) {
        mode = newMode;
        points = [];
        document.querySelectorAll('#toolbar button').forEach(b => {
            if (b.id.startsWith('btn')) b.classList.remove('active');
        });
        
        if (mode === 'calib') {
            document.getElementById('btnCalib').classList.add('active');
            info.innerText = "โหมด 1: จิ้มปักจุด 2 จุด เพื่อกำหนดเส้นอ้างอิงและใส่ความยาวจริง (ใช้นิ้วหนีบเพื่อ Zoom ได้)";
        } else if (mode === 'measure') {
            if (scale === 0) { alert("กรุณาทำขั้นตอนที่ 1 (ตั้งสเกลอ้างอิง) ก่อนครับ"); setMode('calib'); return; }
            document.getElementById('btnMeasure').classList.add('active');
            info.innerText = "โหมด 2: จิ้มปักจุด 2 จุด เพื่อวัดระยะ Manual (เส้นสีแดง)";
        } else if (mode === 'angle') {
            document.getElementById('btnAngle').classList.add('active');
            info.innerText = "โหมด 3: จิ้มปักจุด 3 จุด เพื่อวัดองศา (°) [จุดที่ 2 คือจุดยอดมุม]";
        } else if (mode === 'pan') {
            document.getElementById('btnPan').classList.add('active');
            info.innerText = "โหมดซูม/ย้ายรูป: แตะลากเพื่อย้ายรูป หรือใช้นิ้วหนีบขยายรูปได้ตามต้องการ";
        }
        draw();
    }

    // แปลงพิกัดจากหน้าจอ ไปเป็นพิกัดจริงบนรูปภาพ (ตามค่า Zoom และ Pan)
    function getImgCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX;
        const clientY = e.clientY;
        
        // แปลงพิกัดหน้าจอเป็นพิกัด Canvas
        const canvasX = (clientX - rect.left) * (canvas.width / rect.width);
        const canvasY = (clientY - rect.top) * (canvas.height / rect.height);

        // คำนวณย้อนกลับจาก Matrix Transformation
        const imgX = (canvasX - panX) / zoomScale;
        const imgY = (canvasY - panY) / zoomScale;

        return { x: imgX, y: imgY };
    }

    // --- EVENT LISTENERS สำหรับสัมผัส & เมาส์ ---
    canvas.addEventListener('pointerdown', function(e) {
        if (!img.src) return;
        canvas.setPointerCapture(e.pointerId);
        activePointers.set(e.pointerId, e);

        // ถ้ามีการแตะ 2 นิ้วขึ้นไป -> บังคับเปลี่ยนเป็นโหมด Pan/Zoom ทันที
        if (activePointers.size >= 2) {
            isPanning = false;
            const pts = Array.from(activePointers.values());
            initialPinchDistance = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
            return;
        }

        if (mode === 'pan') {
            isPanning = true;
            startPanX = e.clientX - panX;
            startPanY = e.clientY - panY;
        }
    });

    canvas.addEventListener('pointermove', function(e) {
        if (!img.src) return;
        activePointers.set(e.pointerId, e);

        // จัดการซูมแบบใช้นิ้วถ่าง/หนีบ (Pinch-to-Zoom)
        if (activePointers.size >= 2) {
            const pts = Array.from(activePointers.values());
            const currentDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
            
            if (initialPinchDistance) {
                const factor = currentDist / initialPinchDistance;
                zoomScale = Math.max(0.5, Math.min(10, zoomScale * factor));
                initialPinchDistance = currentDist;
                draw();
            }
            return;
        }

        // จัดการการลากย้ายรูป
        if (isPanning && mode === 'pan') {
            panX = e.clientX - startPanX;
            panY = e.clientY - startPanY;
            draw();
        }
    });

    canvas.addEventListener('pointerup', function(e) {
        if (!img.src) return;
        
        // ถ้าเป็นการใช้นิ้วถ่างซูมเสร็จแล้ว ปล่อยนิ้ว ให้เคลียร์ค่า
        if (activePointers.size >= 2) {
            activePointers.delete(e.pointerId);
            if (activePointers.size < 2) initialPinchDistance = null;
            return;
        }

        // กรณีปักจุดวัดระยะ (ทำงานเฉพาะตอนใช้นิ้วเดียว และไม่ได้อยู่ในโหมด pan)
        if (activePointers.size === 1 && !isPanning && mode !== 'pan') {
            const p = getImgCoords(e);
            
            // ตรวจสอบว่าพิกัดที่กดอยู่ในขอบเขตของรูปภาพหรือไม่
            if (p.x >= 0 && p.x <= img.width && p.y >= 0 && p.y <= img.height) {
                points.push(p);

                if (mode === 'calib' && points.length === 2) {
                    draw();
                    setTimeout(() => {
                        const distPx = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
                        const realMm = prompt("กรอกความยาวจริงของเส้นอ้างอิงนี้ (มิลลิเมตร):", "10");
                        if (realMm && !isNaN(realMm) && parseFloat(realMm) > 0) {
                            scale = parseFloat(realMm) / distPx;
                            calibLine = { p1: points[0], p2: points[1], val: parseFloat(realMm).toFixed(2) + ' mm (Ref)' };
                            info.innerText = `ตั้งสเกลสำเร็จ: 1 px = ${(scale).toFixed(4)} mm (เริ่มวัดระยะเส้นสีแดงได้เลย)`;
                            points = [];
                            setMode('measure');
                        } else {
                            points = [];
                            draw();
                        }
                    }, 50);
                } else if (mode === 'measure' && points.length === 2) {
                    const distPx = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
                    const distMm = distPx * scale;
                    measurements.push({ type: 'line', p1: points[0], p2: points[1], val: distMm.toFixed(2) + ' mm' });
                    points = [];
                    draw();
                } else if (mode === 'angle' && points.length === 3) {
                    const angle = calcAngle(points[0], points[1], points[2]);
                    measurements.push({ type: 'angle', p1: points[0], p2: points[1], p3: points[2], val: angle.toFixed(1) + '°' });
                    points = [];
                    draw();
                } else {
                    draw();
                }
            }
        }

        isPanning = false;
        activePointers.delete(e.pointerId);
    });

    canvas.addEventListener('pointercancel', function(e) {
        activePointers.delete(e.pointerId);
        isPanning = false;
    });

    // รองรับการใช้ Scroll Wheel ของเมาส์ในการ Zoom
    canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        zoomScale = Math.max(0.5, Math.min(10, zoomScale * zoomFactor));
        draw();
    }, { passive: false });


    function calcAngle(p1, p2, p3) {
        const a = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const b = Math.hypot(p2.x - p3.x, p2.y - p3.y);
        const c = Math.hypot(p3.x - p1.x, p3.y - p1.y);
        if (a === 0 || b === 0) return 0;
        const cosVal = (a*a + b*b - c*c) / (2 * a * b);
        const clampedCos = Math.min(1, Math.max(-1, cosVal));
        return Math.acos(clampedCos) * (180 / Math.PI);
    }

    // --- ฟังก์ชันวาด Canvas ตามสถานะ Zoom/Pan ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!img.src) return;

        ctx.save();
        // ปรับ Transformation matrix สำหรับ Zoom และ Pan
        ctx.translate(panX, panY);
        ctx.scale(zoomScale, zoomScale);

        // วาดรูปภาพ
        ctx.drawImage(img, 0, 0);

        // ความหนาเส้นที่ปรับสัดส่วนตามระดับการ Zoom
        const lineWidth = Math.max(2, (canvas.width / 400) / zoomScale);

        // 1. วาดเส้นอ้างอิง Calibration (เส้นสีขาว)
        if (calibLine) {
            ctx.beginPath();
            ctx.lineWidth = lineWidth;
            ctx.strokeStyle = '#ffffff';
            ctx.moveTo(calibLine.p1.x, calibLine.p1.y);
            ctx.lineTo(calibLine.p2.x, calibLine.p2.y);
            ctx.stroke();
            drawText(calibLine.val, (calibLine.p1.x + calibLine.p2.x)/2, (calibLine.p1.y + calibLine.p2.y)/2 - (10 / zoomScale), '#ffffff');
            
            drawPoint(calibLine.p1, '#ffffff');
            drawPoint(calibLine.p2, '#ffffff');
        }

        // 2. วาดเส้นวัดค่า Manual (เส้นสีแดง)
        measurements.forEach(m => {
            ctx.beginPath();
            ctx.lineWidth = lineWidth;
            if (m.type === 'line') {
                ctx.strokeStyle = '#ff453a';
                ctx.moveTo(m.p1.x, m.p1.y); ctx.lineTo(m.p2.x, m.p2.y);
                ctx.stroke();
                drawText(m.val, (m.p1.x + m.p2.x)/2, (m.p1.y + m.p2.y)/2, '#ff453a');
                drawPoint(m.p1, '#ff453a');
                drawPoint(m.p2, '#ff453a');
            } else if (m.type === 'angle') {
                ctx.strokeStyle = '#ff9f0a';
                ctx.moveTo(m.p1.x, m.p1.y); ctx.lineTo(m.p2.x, m.p2.y); ctx.lineTo(m.p3.x, m.p3.y);
                ctx.stroke();
                drawText(m.val, m.p2.x, m.p2.y - (15 / zoomScale), '#ff9f0a');
                drawPoint(m.p1, '#ff9f0a'); drawPoint(m.p2, '#ff9f0a'); drawPoint(m.p3, '#ff9f0a');
            }
        });

        // 3. วาดเส้นร่างชั่วคราว
        if (points.length > 0) {
            ctx.beginPath();
            ctx.lineWidth = lineWidth;
            ctx.strokeStyle = (mode === 'calib') ? '#ffffff' : '#0a84ff';
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();
        }

        points.forEach((p) => {
            drawPoint(p, '#ffd60a');
        });

        ctx.restore();
    }

    function drawPoint(p, color) {
        // รัศมีจุดปรับสัดส่วนตามระดับ Zoom ไม่ให้จุดขยายใหญ่ออกนอกหน้าจอ
        const radius = Math.max(1.5, (canvas.width / 600) / zoomScale);
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
    }

    function drawText(text, x, y, color) {
        const fontSize = Math.max(14, (canvas.width / 45) / zoomScale);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = color;
        ctx.shadowColor = "black";
        ctx.shadowBlur = 4 / zoomScale;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 0;
    }

    function undo() {
        if (points.length > 0) {
            points.pop();
        } else if (measurements.length > 0) {
            measurements.pop();
        } else if (calibLine) {
            calibLine = null;
            scale = 0;
            setMode('calib');
            info.innerText = "ลบเส้นอ้างอิงเรียบร้อย กรุณาตั้งสเกลอ้างอิงใหม่";
        }
        draw();
    }

    function resetData() { points = []; measurements = []; calibLine = null; scale = 0; }
    function clearAll() { resetData(); resetZoom(); draw(); setMode('calib'); }
</script>
</body>
</html>
