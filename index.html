<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Optometry Measurement Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1c1c1e; color: #fff; text-align: center; }
        
        /* หน้า Login Screen */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1c1c1e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .login-card {
            background: #2c2c2e;
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 360px;
        }
        .login-card h2 { margin-bottom: 20px; font-size: 20px; color: #0a84ff; }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #3a3a3c;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .login-card input:focus { border-color: #0a84ff; }
        .login-card button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #30d158;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #login-error {
            color: #ff453a;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* หน้าแอปจริง */
        #main-app { display: none; }
        #toolbar { background: #2c2c2e; padding: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
        button, label.btn { background: #0a84ff; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        button.active { background: #30d158; }
        button.purple { background: #bf5af2; }
        button.purple.active { background: #af52de; }
        button.warning { background: #ff9f0a; }
        button.danger { background: #ff453a; }
        input[type="file"] { display: none; }
        #info-panel { background: #3a3a3c; padding: 10px; font-size: 15px; font-weight: bold; color: #ffd60a; }
        #canvas-container { position: relative; margin: 10px auto; display: inline-block; max-width: 95vw; border: 1px solid #444; overflow: hidden; }
        canvas { display: block; max-width: 100%; cursor: crosshair; touch-action: none; }
    </style>
</head>
<body>

<!-- หน้าสำหรับกรอกรหัสผ่าน -->
<div id="login-screen">
    <div class="login-card">
        <h2>🔒 เข้าสู่ระบบใช้งาน</h2>
        <form onsubmit="handleLogin(event)">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit">ตกลง</button>
            <div id="login-error">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
        </form>
    </div>
</div>

<!-- หน้าเครื่องมือวัดพารามิเตอร์ -->
<div id="main-app">
    <div id="toolbar">
        <label class="btn" for="fileInput">📁 โหลดรูปภาพ</label>
        <input type="file" id="fileInput" accept="image/*">
        <button id="btnCalib" class="active" onclick="setMode('calib')">1. ตั้งสเกลอ้างอิง</button>
        <button id="btnMeasure" onclick="setMode('measure')">2. วัดระยะ (mm)</button>
        <button id="btnPdSplit" class="purple" onclick="setMode('pdsplit')">2.1 วัด PD สองข้าง (R/L)</button>
        <button id="btnAngle" onclick="setMode('angle')">3. วัดองศา (°)</button>
        <button id="btnPan" onclick="setMode('pan')">🔍 ย้าย/ซูมรูป</button>
        <button onclick="resetZoom()">🎯 รีเซ็ตมุมมอง</button>
        <button class="warning" onclick="undo()">↩️ ย้อนกลับ</button>
        <button class="danger" onclick="clearAll()">🔄 ล้างค่าทั้งหมด</button>
    </div>

    <div id="info-panel">สถานะ: กรุณาถ่าย/โหลดรูป แล้วลากเส้นอ้างอิง</div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
</div>

<script>
    function handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('login-error');

        if (u === '805optical' && p === 'thispagewascreatedby805') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        } else {
            errorDiv.style.display = 'block';
        }
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info-panel');
    
    let img = new Image();
    let mode = 'calib';
    let points = [];
    let scale = 0;
    let calibLine = null;
    let measurements = [];

    let zoomScale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startPanX = 0;
    let startPanY = 0;
    
    let activePointers = new Map();
    let initialPinchDistance = null;
    let draggedPointRef = null;

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                resetZoom();
                resetData();
                draw();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    function resetZoom() {
        zoomScale = 1;
        panX = 0;
        panY = 0;
        draw();
    }

    function setMode(newMode) {
        mode = newMode;
        points = [];
        document.querySelectorAll('#toolbar button').forEach(b => {
            if (b.id.startsWith('btn')) b.classList.remove('active');
        });
        
        if (mode === 'calib') {
            document.getElementById('btnCalib').classList.add('active');
            info.innerText = "โหมด 1: จิ้มปักจุด 2 จุด เพื่อกำหนดเส้นอ้างอิง";
        } else if (mode === 'measure') {
            if (scale === 0) { alert("กรุณาทำขั้นตอนที่ 1 (ตั้งสเกลอ้างอิง) ก่อนครับ"); setMode('calib'); return; }
            document.getElementById('btnMeasure').classList.add('active');
            info.innerText = "โหมด 2: จิ้มปักจุด 2 จุด เพื่อวัดระยะ Manual";
        } else if (mode === 'pdsplit') {
            if (scale === 0) { alert("กรุณาทำขั้นตอนที่ 1 (ตั้งสเกลอ้างอิง) ก่อนครับ"); setMode('calib'); return; }
            document.getElementById('btnPdSplit').classList.add('active');
            info.innerText = "โหมด 2.1: จิ้มปัก 3 จุด [1.ตาดำขวา -> 2.กึ่งกลางจมูก -> 3.ตาดำซ้าย] เพื่อแยกค่า PD ขวา/ซ้าย";
        } else if (mode === 'angle') {
            document.getElementById('btnAngle').classList.add('active');
            info.innerText = "โหมด 3: จิ้มปักจุด 3 จุด เพื่อวัดองศา (°) [จุดที่ 2 คือจุดยอดมุม]";
        } else if (mode === 'pan') {
            document.getElementById('btnPan').classList.add('active');
            info.innerText = "โหมดซูม/ย้ายรูป: แตะลากเพื่อย้ายรูป หรือใช้นิ้วหนีบขยายรูปได้ตามต้องการ";
        }
        draw();
    }

    function getImgCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const canvasX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const canvasY = (e.clientY - rect.top) * (canvas.height / rect.height);

        const imgX = (canvasX - panX) / zoomScale;
        const imgY = (canvasY - panY) / zoomScale;

        return { x: imgX, y: imgY };
    }

    function findNearestPoint(imgPt) {
        const threshold = Math.max(15, (canvas.width / 50) / zoomScale);

        for (let p of points) {
            if (Math.hypot(p.x - imgPt.x, p.y - imgPt.y) < threshold) return p;
        }

        if (calibLine) {
            if (Math.hypot(calibLine.p1.x - imgPt.x, calibLine.p1.y - imgPt.y) < threshold) return calibLine.p1;
            if (Math.hypot(calibLine.p2.x - imgPt.x, calibLine.p2.y - imgPt.y) < threshold) return calibLine.p2;
        }

        for (let m of measurements) {
            if (Math.hypot(m.p1.x - imgPt.x, m.p1.y - imgPt.y) < threshold) return m.p1;
            if (Math.hypot(m.p2.x - imgPt.x, m.p2.y - imgPt.y) < threshold) return m.p2;
            if (m.p3 && Math.hypot(m.p3.x - imgPt.x, m.p3.y - imgPt.y) < threshold) return m.p3;
        }

        return null;
    }

    function recalculateMeasurements() {
        if (calibLine) {
            const distPx = Math.hypot(calibLine.p2.x - calibLine.p1.x, calibLine.p2.y - calibLine.p1.y);
            const rawMm = parseFloat(calibLine.val);
            if (!isNaN(rawMm) && distPx > 0) {
                scale = rawMm / distPx;
            }
        }

        measurements.forEach(m => {
            if (m.type === 'line') {
                const distPx = Math.hypot(m.p2.x - m.p1.x, m.p2.y - m.p1.y);
                m.val = (distPx * scale).toFixed(2) + ' mm';
            } else if (m.type === 'pd_split') {
                const distR_px = Math.hypot(m.p2.x - m.p1.x, m.p2.y - m.p1.y);
                const distL_px = Math.hypot(m.p3.x - m.p2.x, m.p3.y - m.p2.y);
                m.valR = (distR_px * scale).toFixed(2);
                m.valL = (distL_px * scale).toFixed(2);
                m.valTotal = ((distR_px + distL_px) * scale).toFixed(2);
            } else if (m.type === 'angle') {
                const angle = calcAngle(m.p1, m.p2, m.p3);
                m.val = angle.toFixed(1) + '°';
            }
        });
    }

    canvas.addEventListener('pointerdown', function(e) {
        if (!img.src) return;
        canvas.setPointerCapture(e.pointerId);
        activePointers.set(e.pointerId, e);

        if (activePointers.size >= 2) {
            draggedPointRef = null;
            isPanning = false;
            const pts = Array.from(activePointers.values());
            initialPinchDistance = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
            return;
        }

        const imgPt = getImgCoords(e);
        const hitPoint = findNearestPoint(imgPt);
        if (hitPoint) {
            draggedPointRef = hitPoint;
            draw();
            return;
        }

        if (mode === 'pan') {
            isPanning = true;
            startPanX = e.clientX - panX;
            startPanY = e.clientY - panY;
        }
    });

    canvas.addEventListener('pointermove', function(e) {
        if (!img.src) return;
        activePointers.set(e.pointerId, e);

        if (activePointers.size >= 2) {
            const pts = Array.from(activePointers.values());
            const currentDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
            
            if (initialPinchDistance) {
                const factor = currentDist / initialPinchDistance;
                zoomScale = Math.max(0.5, Math.min(10, zoomScale * factor));
                initialPinchDistance = currentDist;
                draw();
            }
            return;
        }

        if (draggedPointRef) {
            const imgPt = getImgCoords(e);
            draggedPointRef.x = imgPt.x;
            draggedPointRef.y = imgPt.y;
            recalculateMeasurements();
            draw();
            return;
        }

        if (isPanning && mode === 'pan') {
            panX = e.clientX - startPanX;
            panY = e.clientY - startPanY;
            draw();
        }
    });

    canvas.addEventListener('pointerup', function(e) {
        if (!img.src) return;

        if (draggedPointRef) {
            draggedPointRef = null;
            activePointers.delete(e.pointerId);
            draw();
            return;
        }
        
        if (activePointers.size >= 2) {
            activePointers.delete(e.pointerId);
            if (activePointers.size < 2) initialPinchDistance = null;
            return;
        }

        if (activePointers.size === 1 && !isPanning && mode !== 'pan') {
            const p = getImgCoords(e);
            
            if (p.x >= 0 && p.x <= img.width && p.y >= 0 && p.y <= img.height) {
                points.push(p);

                if (mode === 'calib' && points.length === 2) {
                    draw();
                    setTimeout(() => {
                        const distPx = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
                        const realMm = prompt("กรอกความยาวจริงของเส้นอ้างอิงนี้ (มิลลิเมตร):", "10");
                        if (realMm && !isNaN(realMm) && parseFloat(realMm) > 0) {
                            scale = parseFloat(realMm) / distPx;
                            calibLine = { p1: points[0], p2: points[1], val: parseFloat(realMm).toFixed(2) + ' mm' };
                            info.innerText = `ตั้งสเกลสำเร็จ: 1 px = ${(scale).toFixed(4)} mm`;
                            points = [];
                            setMode('measure');
                        } else {
                            points = [];
                            draw();
                        }
                    }, 50);
                } else if (mode === 'measure' && points.length === 2) {
                    const distPx = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
                    const distMm = distPx * scale;
                    measurements.push({ type: 'line', p1: points[0], p2: points[1], val: distMm.toFixed(2) + ' mm' });
                    points = [];
                    draw();
                } else if (mode === 'pdsplit' && points.length === 3) {
                    const distR_px = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
                    const distL_px = Math.hypot(points[2].x - points[1].x, points[2].y - points[1].y);
                    const valR = (distR_px * scale).toFixed(2);
                    const valL = (distL_px * scale).toFixed(2);
                    const valTotal = ((distR_px + distL_px) * scale).toFixed(2);

                    measurements.push({
                        type: 'pd_split',
                        p1: points[0], // จุดตาดำขวา (OD)
                        p2: points[1], // จุดสันจมูก (Center)
                        p3: points[2], // จุดตาดำซ้าย (OS)
                        valR: valR,
                        valL: valL,
                        valTotal: valTotal
                    });
                    points = [];
                    draw();
                } else if (mode === 'angle' && points.length === 3) {
                    const angle = calcAngle(points[0], points[1], points[2]);
                    measurements.push({ type: 'angle', p1: points[0], p2: points[1], p3: points[2], val: angle.toFixed(1) + '°' });
                    points = [];
                    draw();
                } else {
                    draw();
                }
            }
        }

        isPanning = false;
        activePointers.delete(e.pointerId);
    });

    canvas.addEventListener('pointercancel', function(e) {
        activePointers.delete(e.pointerId);
        isPanning = false;
        draggedPointRef = null;
        draw();
    });

    canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        zoomScale = Math.max(0.5, Math.min(10, zoomScale * zoomFactor));
        draw();
    }, { passive: false });

    function calcAngle(p1, p2, p3) {
        const a = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const b = Math.hypot(p2.x - p3.x, p2.y - p3.y);
        const c = Math.hypot(p3.x - p1.x, p3.y - p1.y);
        if (a === 0 || b === 0) return 0;
        const cosVal = (a*a + b*b - c*c) / (2 * a * b);
        const clampedCos = Math.min(1, Math.max(-1, cosVal));
        return Math.acos(clampedCos) * (180 / Math.PI);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!img.src) return;

        ctx.save();
        ctx.translate(panX, panY);
        ctx.scale(zoomScale, zoomScale);

        ctx.drawImage(img, 0, 0);

        const lineWidth = Math.max(2, (canvas.width / 400) / zoomScale);

        // 1. เส้นสเกลอ้างอิง (สีขาว)
        if (calibLine) {
            ctx.beginPath();
            ctx.lineWidth = lineWidth;
            ctx.strokeStyle = '#ffffff';
            ctx.moveTo(calibLine.p1.x, calibLine.p1.y);
            ctx.lineTo(calibLine.p2.x, calibLine.p2.y);
            ctx.stroke();
            drawText(calibLine.val + ' (Ref)', (calibLine.p1.x + calibLine.p2.x)/2, (calibLine.p1.y + calibLine.p2.y)/2 - (10 / zoomScale), '#ffffff');
            
            drawPoint(calibLine.p1, '#ffffff');
            drawPoint(calibLine.p2, '#ffffff');
        }

        // 2. รายการเส้นวัดผลทั้งหมด
        measurements.forEach(m => {
            ctx.beginPath();
            ctx.lineWidth = lineWidth;

            if (m.type === 'line') {
                ctx.strokeStyle = '#ff453a';
                ctx.moveTo(m.p1.x, m.p1.y); ctx.lineTo(m.p2.x, m.p2.y);
                ctx.stroke();
                drawText(m.val, (m.p1.x + m.p2.x)/2, (m.p1.y + m.p2.y)/2, '#ff453a');
                drawPoint(m.p1, '#ff453a');
                drawPoint(m.p2, '#ff453a');
            } else if (m.type === 'pd_split') {
                // เส้นจาก ตาดำขวา -> จมูก -> ตาดำซ้าย
                ctx.strokeStyle = '#bf5af2';
                ctx.moveTo(m.p1.x, m.p1.y); ctx.lineTo(m.p2.x, m.p2.y); ctx.lineTo(m.p3.x, m.p3.y);
                ctx.stroke();

                // ข้อความระบุค่า R และ L
                drawText(`R: ${m.valR} mm`, (m.p1.x + m.p2.x)/2, (m.p1.y + m.p2.y)/2 + (15 / zoomScale), '#bf5af2');
                drawText(`L: ${m.valL} mm`, (m.p2.x + m.p3.x)/2, (m.p2.y + m.p3.y)/2 + (15 / zoomScale), '#bf5af2');
                drawText(`Total PD: ${m.valTotal} mm`, m.p2.x, m.p2.y - (20 / zoomScale), '#ffd60a');

                drawPoint(m.p1, '#bf5af2'); // OD
                drawPoint(m.p2, '#ffd60a'); // Bridge (จุดกลาง)
                drawPoint(m.p3, '#bf5af2'); // OS
            } else if (m.type === 'angle') {
                ctx.strokeStyle = '#ff9f0a';
                ctx.moveTo(m.p1.x, m.p1.y); ctx.lineTo(m.p2.x, m.p2.y); ctx.lineTo(m.p3.x, m.p3.y);
                ctx.stroke();
                drawText(m.val, m.p2.x, m.p2.y - (15 / zoomScale), '#ff9f0a');
                drawPoint(m.p1, '#ff9f0a'); drawPoint(m.p2, '#ff9f0a'); drawPoint(m.p3, '#ff9f0a');
            }
        });

        // 3. เส้นร่างขณะกำลังปักจุด
        if (points.length > 0) {
            ctx.beginPath();
            ctx.lineWidth = lineWidth;
            ctx.strokeStyle = (mode === 'calib') ? '#ffffff' : (mode === 'pdsplit' ? '#bf5af2' : '#0a84ff');
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();
        }

        points.forEach((p) => {
            drawPoint(p, '#ffd60a');
        });

        ctx.restore();

        // 4. แว่นขยายเฉพาะจุดขณะกำลังลาก
        if (draggedPointRef) {
            drawMagnifier(draggedPointRef);
        }
    }

    function drawPoint(p, color) {
        const radius = Math.max(1.5, (canvas.width / 600) / zoomScale);
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        if (draggedPointRef === p) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius * 3, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 214, 10, 0.4)";
            ctx.fill();
        }
    }

    function drawText(text, x, y, color) {
        const fontSize = Math.max(14, (canvas.width / 45) / zoomScale);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = color;
        ctx.shadowColor = "black";
        ctx.shadowBlur = 4 / zoomScale;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 0;
    }

    function drawMagnifier(targetPt) {
        const magSize = Math.min(canvas.width, canvas.height) * 0.28;
        const magX = 20;
        const magY = 20;
        const zoomLevel = 4;

        ctx.save();

        ctx.beginPath();
        ctx.arc(magX + magSize/2, magY + magSize/2, magSize/2, 0, Math.PI * 2);
        ctx.clip();

        ctx.fillStyle = '#1c1c1e';
        ctx.fillRect(magX, magY, magSize, magSize);

        ctx.translate(magX + magSize/2, magY + magSize/2);
        ctx.scale(zoomLevel, zoomLevel);
        ctx.translate(-targetPt.x, -targetPt.y);

        ctx.drawImage(img, 0, 0);

        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.arc(magX + magSize/2, magY + magSize/2, magSize/2, 0, Math.PI * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#0a84ff';
        ctx.stroke();

        const cx = magX + magSize/2;
        const cy = magY + magSize/2;
        ctx.beginPath();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#30d158';
        ctx.moveTo(cx - 15, cy); ctx.lineTo(cx + 15, cy);
        ctx.moveTo(cx, cy - 15); ctx.lineTo(cx, cy + 15);
        ctx.stroke();

        ctx.restore();
    }

    function undo() {
        if (points.length > 0) {
            points.pop();
        } else if (measurements.length > 0) {
            measurements.pop();
        } else if (calibLine) {
            calibLine = null;
            scale = 0;
            setMode('calib');
            info.innerText = "ลบเส้นอ้างอิงเรียบร้อย กรุณาตั้งสเกลอ้างอิงใหม่";
        }
        draw();
    }

    function resetData() { points = []; measurements = []; calibLine = null; scale = 0; }
    function clearAll() { resetData(); resetZoom(); draw(); setMode('calib'); }
</script>
</body>
</html>
